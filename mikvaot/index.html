<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מקוואות</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="shared/promo/achat-promo.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 7 6 10.5A6 6 0 0 1 6 13.5C6 10 9 7 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 15a3 3 0 0 0 3 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div class="titles"><h1>מקוואות</h1><span class="sub" id="crumb">כל הערים</span></div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="עיר, שכונה או רחוב" aria-label="חיפוש">
    </label>
    <div class="actions">
      <button class="icon-btn" id="btnRail" title="הצגת/הסתרת רשימת הערים" aria-label="רשימת ערים"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.8" cy="6" r="1.1" fill="currentColor"/><circle cx="4.8" cy="12" r="1.1" fill="currentColor"/><circle cx="4.8" cy="18" r="1.1" fill="currentColor"/></svg><span class="lbl">ערים</span></button>
      <button class="icon-btn" id="btnLoc" title="המיקום שלי — העיר הקרובה" aria-label="המיקום שלי"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">מיקום</span></button>
      <button class="icon-btn" id="btnFav" title="מועדפים" aria-label="מועדפים" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9 1 5.6L12 16.6l-5.1 2.6 1-5.6-4-3.9 5.6-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">מועדפים</span></button>
      <button class="icon-btn" id="btnOrgs" title="ארגונים, מועצות דתיות, בתי דין ורבנויות — טלפונים ואתרים" aria-label="ארגונים"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 20V6.6L12 4l6 2.6V20M9.5 9h1M13.5 9h1M9.5 12.5h1M13.5 12.5h1M10.5 20v-3.5h3V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">ארגונים</span></button>
      <button class="icon-btn" id="btnExport" title="ייצוא הרשימה לטקסט להעתקה" aria-label="ייצוא"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 8l4-4 4 4M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">ייצוא</span></button>
      <button class="icon-btn" id="btnPrint" title="הדפסה / שמירה כ-PDF של הרשימה המוצגת" aria-label="הדפסה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V4h10v4M7 16H5.5A1.5 1.5 0 0 1 4 14.5v-5A1.5 1.5 0 0 1 5.5 8h13A1.5 1.5 0 0 1 20 9.5v5a1.5 1.5 0 0 1-1.5 1.5H17M7 13h10v7H7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">הדפסה</span></button>
      <button class="icon-btn" id="btnLang" title="English" aria-label="English / עברית" style="font:inherit;font-size:.78em;font-weight:700">EN</button>
      <button class="icon-btn" id="btnInfo" title="אודות, מקורות ועדכון נתונים" aria-label="אודות"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 11v5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7.8" r="1" fill="currentColor"/></svg><span class="lbl">אודות</span></button>
    </div>
  </header>

  <div class="body">
    <aside class="rail" aria-label="ערים">
      <div class="seg" id="region" role="tablist"><button class="seg-b" data-region="il" aria-selected="true">ישראל</button><button class="seg-b" data-region="abroad">חו"ל</button></div>
      <button class="rail-home" id="btnHome"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg> כל הערים</button>
      <input id="cityFilter" type="search" placeholder="סינון ערים" aria-label="סינון ערים">
      <nav id="cityList" class="city-list"></nav>
    </aside>
    <div class="main-col">
      <div class="viewbar"><div class="seg viewtabs" id="viewTabs" role="tablist" aria-label="תצוגה"><button class="seg-b" data-tab="list" aria-selected="true">רשימה</button><button class="seg-b" data-tab="map" aria-selected="false">מפה</button></div><span class="viewscope" id="viewScope"></span></div>
      <div class="filters">
        <div class="chips" id="types" role="tablist">
          <button class="chip" data-type="" aria-selected="true">הכל</button>
          <button class="chip" data-type="women">נשים</button>
          <button class="chip" data-type="men">גברים</button>
          <button class="chip" data-type="kelim">כלים</button>
        </div>
        <label class="toggle"><input type="checkbox" id="accOnly"> נגיש בלבד</label>
        <label class="toggle"><input type="checkbox" id="hoursOnly"> עם שעות</label>
      </div>
      <div class="daybar" id="daybar" hidden></div>
      <main id="list" class="list" tabindex="-1"></main>
      <section id="mapTab" class="map-tab" aria-label="מפה" hidden></section>
    </div>
    <aside id="preview" class="preview" aria-label="תצוגה מקדימה" hidden></aside>
  </div>

  <footer class="note">השעות משתנות בין קיץ לחורף ובערבי שבת וחג — יש לאמת בטלפון לפני ההגעה. לכל שאלה: רב הקהילה והאחראית/האחראי במקווה.</footer>
</div>

<div class="scrim" id="infoScrim" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <header><h2 id="infoTitle">אודות</h2><button class="icon-btn" id="infoClose" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
    <div class="dialog-body" id="infoBody"></div>
  </section>
</div>

<div class="toast" id="toast" hidden></div>
<div class="print-head" id="printHead"></div>
<div class="print-map" id="printMap"></div>
<div class="print-foot" id="printFoot"></div>

<script src="data.js"></script>
<script src="bridge.js"></script>
<script src="map-core.js"></script>
<script src="world-basemap.js"></script>
<script src="streets-cities.js"></script>
<script src="map-ui.js"></script>
<script src="shared/report/crash-report.js"></script>
<script src="shared/promo/achat-promo.js"></script>
<script src="app.js"></script>
<script src="i18n.js"></script>
</body>
</html>
