name: מקוואות — Release

# יוצר GitHub Release לכל גרסה חדשה, עם קובץ ה-.otzplugin ותיאור מתוך README.
# בודק קודם שהחבילה בענף זהה לאריזה של הקוד (אריזה דטרמיניסטית).
on:
  push:
    branches: ['מקוואות']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package matches source
        run: |
          v="$(node -p "require('./mikvaot/manifest.json').version")"
          python3 mikvaot-build/pack.py mikvaot /tmp/e.otzplugin
          cmp /tmp/e.otzplugin "mikvaot-$v.otzplugin" || { echo "::error::mikvaot-$v.otzplugin אינו תואם לקוד. ארזו מחדש."; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./mikvaot/manifest.json').version")"
          tag="mikvaot-v$v"; file="mikvaot-$v.otzplugin"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag כבר קיים"; exit 0; fi
          awk -v h="## מה חדש ב-$v" 'index($0,h)==1{f=1;next} /^## /{if(f)exit} f' README.md > notes.md
          printf '\n### התקנה\nבאוצריא: כלים ← תוספים ← התקן תוסף חדש, ובחירת הקובץ.\n' >> notes.md
          gh release create "$tag" "$file" mikvaot-data.json --target "$GITHUB_SHA" --title "מקוואות $v" --notes-file notes.md --prerelease
